packages:
  - packages/*
  - "!packages/eslint-plugin-twofold"
  - examples/*
  - sites/*
  - tools/*

catalog:
  "@types/node": ^26.5.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  esbuild: 0.28.2
  oxlint: ^1.82.0
  react: 19.3.0
  react-dom: 19.3.0
  react-server-dom-webpack: 19.3.0
  typescript: ^7.0.2

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - react@19.3.0
  - react-dom@19.3.0
  - react-server-dom-webpack@19.3.0
  - scheduler@0.28.0
  - react-refresh@0.18.0
  - oxc-transform-react@0.147.0

allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  rolldown: true
  sharp: true

nodeOptions: "--conditions=react-server"
